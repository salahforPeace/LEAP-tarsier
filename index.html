<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ET AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: #16161d;
      border-bottom: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: #7c6cff; }
    .api-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .api-box input {
      background: #1e1e28;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      width: 260px;
      font-size: 13px;
    }
    .api-box input:focus {
      outline: none;
      border-color: #7c6cff;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #7c6cff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1e1e28;
      border: 1px solid #2e2e3a;
      border-bottom-left-radius: 4px;
    }
    .status {
      align-self: center;
      font-size: 13px;
      color: #888;
      background: #1a1a22;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .error { color: #ff6b6b; }
    footer {
      padding: 16px;
      background: #16161d;
      border-top: 1px solid #2a2a35;
    }
    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    #prompt {
      flex: 1;
      background: #1e1e28;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      resize: none;
      min-height: 52px;
      max-height: 140px;
    }
    #prompt:focus { outline: none; border-color: #7c6cff; }
    #send {
      background: #7c6cff;
      color: white;
      border: none;
      width: 52px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ET <span>AI</span></div>
    <div class="api-box">
      <input type="password" id="apiKey" placeholder="sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE" />
    </div>
  </header>

  <div id="chat">
    <div class="msg bot">
হ্যালো! আমি <b>ET AI</b>।

১. উপরে Manus API Key পেস্ট করো
২. নিচে প্রশ্ন লিখে ➤ চাপো

Save বাটনের দরকার নেই।
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="prompt" rows="1" placeholder="কী করতে চাও? লিখো..." onkeydown="handleKey(event)"></textarea>
      <button id="send" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint">Powered by Manus AI API • ET AI</div>
  </footer>

  <script>
    const BASE = "https://api.manus.ai";

    // আগের সেভ করা key থাকলে দেখাও
    const saved = localStorage.getItem("sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE");
    if (saved) {
      document.getElementById("apiKey").value = saved;
    }

    // টাইপ/পেস্ট করলেই অটো সেভ
    document.getElementById("apiKey").addEventListener("input", function () {
      const v = this.value.trim();
      if (v) localStorage.setItem("manus_api_key", v);
    });

    function getKey() {
      // আগে ইনপুট বক্স থেকে নাও, না থাকলে localStorage
      const fromInput = document.getElementById("apiKey").value.trim();
      if (fromInput) {
        localStorage.setItem("sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE", fromInput);
        return fromInput;
      }
      return localStorage.getItem("sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE") || "";
    }

    function addMsg(text, type = "bot") {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
      return div;
    }

    function addStatus(text, isError = false) {
      const div = document.createElement("div");
      div.className = "status" + (isError ? " error" : "");
      div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
      return div;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function sendMessage() {
      const key = getKey();
      if (!key) {
        alert("sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE");
        document.getElementById("apiKey").focus();
        return;
      }

      const promptEl = document.getElementById("prompt");
      const text = promptEl.value.trim();
      if (!text) return;

      promptEl.value = "";
      document.getElementById("send").disabled = true;

      addMsg(text, "user");
      const statusEl = addStatus("ET AI কাজ শুরু করছে...");

      try {
        const createRes = await fetch(`${BASE}/v2/task.create`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-manus-api-key": key
          },
          body: JSON.stringify({
            message: { content: text }
          })
        });

        const createData = await createRes.json();

        if (!createData.ok) {
          throw new Error(createData.error?.message || JSON.stringify(createData) || "Task create failed");
        }

        const taskId = createData.task_id;
        statusEl.textContent = "কাজ চলছে... অপেক্ষা করো";

        await pollTask(taskId, statusEl, key);

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error: " + (err.message || err);
        statusEl.classList.add("error");
      } finally {
        document.getElementById("send").disabled = false;
      }
    }

    async function pollTask(taskId, statusEl, key) {
      let tries = 0;
      const maxTries = 90;

      while (tries < maxTries) {
        tries++;
        await sleep(2500);

        const res = await fetch(
          `${BASE}/v2/task.listMessages?task_id=${encodeURIComponent(taskId)}&order=desc&limit=40`,
          {
            headers: { "x-manus-api-key": key }
          }
        );

        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.error?.message || "Poll failed");
        }

        const messages = data.messages || [];

        // status খুঁজি
        let agentStatus = null;
        let brief = "";
        for (const m of messages) {
          if (m.type === "status_update" && m.status_update) {
            agentStatus = m.status_update.agent_status;
            brief = m.status_update.brief || m.status_update.description || "";
            break;
          }
        }

        if (agentStatus === "running") {
          statusEl.textContent = "কাজ চলছে... " + (brief || "");
          continue;
        }

        if (agentStatus === "error") {
          const errMsg = messages.find(m => m.type === "error_message");
          throw new Error(errMsg?.error_message?.content || "Agent error");
        }

        // assistant এর উত্তর খুঁজি
        const assistant = messages.find(m => m.type === "assistant_message");
        if (assistant?.assistant_message?.content) {
          statusEl.remove();
          addMsg(assistant.assistant_message.content, "bot");
          return;
        }

        if (agentStatus === "stopped") {
          statusEl.textContent = "শেষ হয়েছে, কিন্তু টেক্সট উত্তর পাওয়া যায়নি।";
          return;
        }

        if (agentStatus === "waiting") {
          statusEl.textContent = "Agent কিছু কনফার্মেশনের অপেক্ষায়... (এই সিম্পল UI-তে সাপোর্ট নেই)";
          // এখানে থেমে যাই, নাহলে লুপ চলতে থাকবে
          return;
        }
      }

      throw new Error("Timeout — অনেকক্ষণ ধরে উত্তর আসেনি");
    }
  </script>
</body>
</html>
