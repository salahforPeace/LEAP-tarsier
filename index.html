<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ET AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: #16161d;
      border-bottom: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: #7c6cff; }
    .api-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .api-box input {
      background: #1e1e28;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      width: 220px;
      font-size: 13px;
    }
    .api-box button {
      background: #7c6cff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .api-box button:hover { background: #6a5af0; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #7c6cff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1e1e28;
      border: 1px solid #2e2e3a;
      border-bottom-left-radius: 4px;
    }
    .status {
      align-self: center;
      font-size: 13px;
      color: #888;
      background: #1a1a22;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .error { color: #ff6b6b; }

    footer {
      padding: 16px;
      background: #16161d;
      border-top: 1px solid #2a2a35;
    }
    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    #prompt {
      flex: 1;
      background: #1e1e28;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      resize: none;
      min-height: 52px;
      max-height: 140px;
    }
    #prompt:focus { outline: none; border-color: #7c6cff; }
    #send {
      background: #7c6cff;
      color: white;
      border: none;
      width: 52px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ET <span>AI</span></div>
    <div class="api-box">
      <input type="password" id="apiKey" placeholder="Manus API Key" />
      <button onclick="saveKey()">Save</button>
    </div>
  </header>

  <div id="chat">
    <div class="msg bot">
      হ্যালো! আমি <b>ET AI</b>।  
Manus AI-এর মতোই কাজ করি।  
উপরে তোমার Manus API Key দিয়ে Save করো, তারপর যা খুশি জিজ্ঞাসা করো।
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="prompt" rows="1" placeholder="কী করতে চাও? লিখো..." onkeydown="handleKey(event)"></textarea>
      <button id="send" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint">Powered by Manus AI API • ET AI</div>
  </footer>

  <script>
    const BASE = "https://api.manus.ai";
    let currentTaskId = null;
    let polling = false;

    // Load saved key
    const saved = localStorage.getItem("sk-Y_z4fyyhgucJCjjawN0lfeZdB4I6wzmOZl4MSWkcRM_ojv96jFitOudO0D61iaTa0Ap_pNNqyapb113omfVX_9DTgxpE");
    if (saved) document.getElementById("apiKey").value = saved;

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      if (!key) return alert("API Key দাও");
      localStorage.setItem("manus_api_key", key);
      alert("API Key সেভ হয়েছে ✓");
    }

    function getKey() {
      return localStorage.getItem("manus_api_key") || document.getElementById("apiKey").value.trim();
    }

    function addMsg(text, type = "bot") {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
      return div;
    }

    function addStatus(text, isError = false) {
      const div = document.createElement("div");
      div.className = "status" + (isError ? " error" : "");
      div.textContent = text;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
      return div;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const key = getKey();
      if (!key) return alert("আগে Manus API Key সেভ করো");

      const promptEl = document.getElementById("prompt");
      const text = promptEl.value.trim();
      if (!text) return;

      promptEl.value = "";
      document.getElementById("send").disabled = true;

      addMsg(text, "user");
      const statusEl = addStatus("ET AI কাজ শুরু করছে...");

      try {
        // 1. Create task
        const createRes = await fetch(`${BASE}/v2/task.create`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-manus-api-key": key
          },
          body: JSON.stringify({
            message: { content: text }
          })
        });

        const createData = await createRes.json();
        if (!createData.ok) {
          throw new Error(createData.error?.message || "Task create failed");
        }

        currentTaskId = createData.task_id;
        statusEl.textContent = "কাজ চলছে... (poll করছি)";

        // 2. Poll for result
        await pollTask(currentTaskId, statusEl, key);

      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.classList.add("error");
      } finally {
        document.getElementById("send").disabled = false;
      }
    }

    async function pollTask(taskId, statusEl, key) {
      let tries = 0;
      const maxTries = 120; // ~4 minutes (2s interval)

      while (tries < maxTries) {
        tries++;
        await sleep(2000);

        const res = await fetch(
          `${BASE}/v2/task.listMessages?task_id=${taskId}&order=desc&limit=30`,
          { headers: { "x-manus-api-key": key } }
        );
        const data = await res.json();
        if (!data.ok) throw new Error(data.error?.message || "Poll failed");

        const messages = data.messages || [];

        // Check status
        const statusMsg = messages.find(m => m.type === "status_update");
        const agentStatus = statusMsg?.status_update?.agent_status;

        if (agentStatus === "running") {
          statusEl.textContent = "কাজ চলছে... " + (statusMsg?.status_update?.brief || "");
          continue;
        }

        if (agentStatus === "error") {
          const err = messages.find(m => m.type === "error_message");
          throw new Error(err?.error_message?.content || "Agent error");
        }

        if (agentStatus === "stopped" || agentStatus === "waiting") {
          // Find the latest assistant message
          const assistant = messages.find(m => m.type === "assistant_message");
          if (assistant?.assistant_message?.content) {
            statusEl.remove();
            addMsg(assistant.assistant_message.content, "bot");
            return;
          }
          // sometimes content comes a bit later
          if (agentStatus === "stopped") {
            statusEl.textContent = "শেষ হয়েছে, কিন্তু উত্তর পাওয়া যায়নি। আবার চেষ্টা করো।";
            return;
          }
        }
      }
      throw new Error("Timeout — অনেকক্ষণ ধরে উত্তর আসেনি");
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
